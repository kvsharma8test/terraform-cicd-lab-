name: Terraform CI/CD
 
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
 
permissions:
  contents: read
 
env:
  TF_IN_AUTOMATION: "true"
 
jobs:
  # ---------- CI: runs on every pull request and push ----------
  validate-and-plan:
    name: Validate & Plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
 
      - name: Terraform init
        run: terraform init -input=false
 
      - name: Terraform format check
        run: terraform fmt -check -recursive
 
      - name: Terraform validate
        run: terraform validate
 
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
 
      - name: Run TFLint
        run: |
          tflint --init
          tflint
 
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
 
      - name: Security scan
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 .
 
      - name: Terraform plan
        run: terraform plan -input=false -var="environment=prod" -out=tfplan
 
  # ---------- CD: only on main, only after approval ----------
  apply:
    name: Apply to Production
    needs: validate-and-plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
 
      - name: Terraform init
        run: terraform init -input=false
 
      - name: Terraform plan
        run: terraform plan -input=false -var="environment=prod" -out=tfplan
 
      - name: Terraform apply
        run: terraform apply -input=false tfplan
 
      - name: Post-deployment validation
        run: |
          test -f output/prod-app.txt
          cat output/prod-app.txt
